kind = "web"
previewPath = "/"
title = "Gridora"
description = "A real-data creative connections platform for designers and clients, with persistent authentication, connections, private messaging, profiles, and secure admin tools."
version = "1.0.0"
id = "artifacts/gridora"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21926

[services.development]
run = "pnpm --filter @workspace/gridora run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gridora", "run", "build" ]
serve = "static"
publicDir = "artifacts/gridora/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21926"
BASE_PATH = "/"
